<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadê Meu Político?</title>
<meta name="description" content="Veja como votaram, quanto gastaram e como foram eleitos os políticos do seu estado e da sua cidade. Dados oficiais, explicados de um jeito simples.">
<meta name="theme-color" content="#0b1b33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f7,#0b0f17);--card:light-dark(#ffffff,#141a25);--card2:light-dark(#f7f8fa,#1a2130);
--ink:light-dark(#0c1424,#eef1f6);--mute:light-dark(#5d6677,#97a1b3);--line:light-dark(#e5e8ee,#232b3a);
--navy:#0b1b33;--navy2:#13294d;--gold:#ffd23f;--gold-ink:#1a1400;
--sim:light-dark(#2563eb,#6b9bff);--nao:light-dark(#e5484d,#ff7b7f);--ok:light-dark(#0f9d58,#43c584);
--r:18px;--sh:0 1px 2px rgba(12,20,36,.05),0 6px 20px rgba(12,20,36,.06);
--nav:68px}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
a{color:inherit}
img{max-width:100%}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{white-space:nowrap;font:900 19px/1 Archivo,sans-serif;letter-spacing:-.02em;text-decoration:none;color:#fff;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-style:normal;font-size:17px}
.logo b{color:var(--gold)}
.ufpill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none;font:700 14px Inter;padding:7px 12px;border-radius:999px;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 24px}
h1{font:900 clamp(28px,7vw,40px)/1.06 Archivo,sans-serif;letter-spacing:-.02em;margin:18px 0 8px;text-wrap:balance}
h2{font:800 21px/1.2 Archivo,sans-serif;letter-spacing:-.01em;margin:30px 0 12px}
h3{font-family:Archivo,sans-serif}
.lead{margin:0 0 18px;color:var(--mute);max-width:62ch}
.pt{font-size:14px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:20px}
.kick{font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.sec{font:700 12px Inter;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:28px 2px 10px;display:flex;justify-content:space-between;gap:10px}
.card,.news,.proj,.hero,.stat,.soon{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.card{padding:6px 16px}
.news,.proj,.hero{padding:18px;margin-bottom:12px}
.proj{display:block;text-decoration:none;transition:transform .15s}
.proj:active{transform:scale(.99)}
.news h3,.proj h3{font-weight:800;font-size:20px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
.news p{margin:0 0 10px}
.lbl{font:700 12px Inter;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:3px}
.porque{background:var(--card2);border-radius:12px;padding:12px 14px;margin:10px 0}
.fonte{font-size:13px;color:var(--mute)}
.fonte a{color:var(--sim)}
.muda{background:light-dark(#eef4ff,#14213d);border-radius:14px;padding:14px 16px;margin:14px 0}
.oficial{font-size:14px;color:var(--mute)}
.previa{display:flex;gap:10px;align-items:flex-start;background:light-dark(#fff8db,#2a2410);border:1px solid light-dark(#f3e3a1,#4a3f17);border-radius:14px;padding:10px 14px;font-size:13.5px;margin:14px 0 4px}
.previa b{font-weight:700}
.ufs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.uf{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:16px;padding:14px 12px;text-decoration:none;display:flex;flex-direction:column;gap:2px}
.uf b{font:900 22px Archivo}
.uf span{font-size:12px;color:var(--mute);line-height:1.25}
.uf:hover{border-color:var(--navy2)}
.back{display:inline-flex;align-items:center;gap:6px;font:600 15px Inter;padding:14px 0 2px;text-decoration:none;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter;padding:9px 15px;border-radius:999px;min-height:40px;cursor:pointer}
.chip[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:light-dark(#e7eaf0,#1a2130);border-radius:12px;padding:4px;gap:4px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--mute);font:600 14px Inter;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;height:46px;border-radius:12px;overflow:hidden;margin-top:12px;background:var(--line)}
.bar div{display:flex;align-items:center;padding:0 12px;font:800 17px Archivo;color:#fff;white-space:nowrap;overflow:hidden}
.bar .s{background:var(--sim)}.bar .n{background:var(--nao)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:12px 0 6px}
.mini i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.list{display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.dep{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}
.dep:hover{background:var(--card2)}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;background:var(--line);display:grid;place-items:center;font-weight:800}
.nm{font:700 16px/1.25 Inter;overflow-wrap:anywhere}
.v{font:700 13px Inter;padding:5px 10px;border-radius:999px;color:#fff;background:var(--mute);text-align:center;max-width:130px;line-height:1.25}
.v.Sim{background:var(--sim)}.v.Não{background:var(--nao)}
.v.tag{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.v.el{background:light-dark(#e3f6ec,#123224);color:var(--ok)}
input[type=search],select.busca,#local{width:100%;font:16px Inter;padding:11px 14px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:12px;box-shadow:var(--sh)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.card>.rk:last-child,.card>.row:last-child{border-bottom:0}
.rk>b{font:800 14px Archivo;color:var(--mute)}
.rk .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.rk .t i{display:block;height:100%;background:var(--navy2)}
.rk>span:last-child{font:700 15px Inter;text-align:right;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row>span{overflow-wrap:anywhere}
.big{font:900 clamp(30px,8vw,40px)/1 Archivo;letter-spacing:-.02em}
.ph{display:flex;gap:16px;align-items:center;margin:16px 0 18px}
.ph .av{width:78px;height:78px;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:16px}
.stat .big{font-size:30px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--gold-ink);border:0;font:800 16px Archivo;padding:13px 20px;border-radius:14px;min-height:50px;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(255,210,63,.35);width:100%}
.err{padding:20px;border:1px solid var(--nao);border-radius:14px;background:var(--card);margin-top:16px}
.vazio{color:var(--mute);padding:16px;border:1px dashed var(--line);border-radius:14px;background:var(--card)}
details{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;box-shadow:var(--sh)}
summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";transform:rotate(90deg);color:var(--mute);font-size:20px;line-height:1}
details[open] summary::after{transform:rotate(-90deg)}
details[open]{padding-bottom:8px}
.party{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.seats{font:800 13px Inter;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}
.seats.z{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font:800 18px Archivo}
.kpi span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:light-dark(rgba(255,255,255,.94),rgba(17,22,33,.94));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mute);font:600 11px Inter}
.bnav a svg{width:24px;height:24px}
.bnav a.on{color:var(--ink)}
.bnav a.on svg{color:var(--navy2)}
@media (prefers-color-scheme:dark){.bnav a.on svg{color:var(--gold)}}
.bnav[hidden],.ufpill[hidden]{display:none}
.opc{display:grid;gap:12px;margin-top:8px}
.opcao{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);text-decoration:none}
.opcao .ic{grid-row:1/3;width:54px;height:54px;border-radius:16px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:900 22px Archivo}
.opcao b{font:900 24px/1.1 Archivo;letter-spacing:-.01em}
.opcao span:last-child{color:var(--mute);font-size:14px}
.opcao.off{opacity:.45}
.impacto{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border-radius:14px;padding:14px;background:#fff4c7;color:#2b2100}
.impacto .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:24px}
.impacto .lbl{color:inherit;opacity:.75;margin-bottom:2px}
.impacto b{font:800 17px/1.3 Archivo;display:block}
.t-Precos{background:#ffe5d3;color:#3a1800}.t-Trabalho{background:#dde9ff;color:#0b2152}.t-Saude{background:#d9f5e6;color:#073d22}.t-Aposentadoria{background:#ece2ff;color:#2a1257}
.t-Transporte{background:#d8f1f6;color:#063540}.t-Impostos{background:#ffe0e1;color:#4a0b0e}.t-Educacao{background:#e6f0d6;color:#203a06}.t-Seguranca{background:#e3e7ee;color:#121b2b}.t-Moradia{background:#f4e6d6;color:#3a2207}
.news details.mais{box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:0;margin-top:6px;background:transparent}
.news details.mais summary{color:var(--sim);padding:12px 0 4px}
.hback{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;display:grid;place-items:center;font:800 22px Inter}
.hback[hidden],.back[hidden]{display:none}
.top .in{justify-content:flex-start}.top .ufpill{margin-left:auto}
@media (max-width:420px){.top.sub .logo span{display:none}}
.termo{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--nao),#f5b400,var(--ok));position:relative;margin-top:4px}
.termo i{position:absolute;top:-6px;width:8px;height:26px;border-radius:4px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 3px var(--card)}
.hero details.mais{box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:0;margin-top:12px;background:transparent}
footer{font-size:12.5px;color:var(--mute);padding:22px 0 8px;border-top:1px solid var(--line);margin-top:34px}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="hback" id="hback" href="#inicio" hidden aria-label="Voltar">←</a><a class="logo" href="#inicio"><i>?</i><span>Cadê Meu <b>Político</b></span></a><a class="ufpill" id="ufpill" href="#inicio" hidden></a></div></div>
<div class="wrap">
  <main id="app"><p class="pt" style="padding-top:20px">Carregando…</p></main>
  <footer>Dados oficiais da Câmara dos Deputados, do Senado Federal e do TSE, atualizados todo dia. Um projeto de Bruno Braz. <span id="upd"></span></footer>
</div>
<nav class="bnav" id="bnav" hidden></nav>
<script src="app.js?v=11"></script>
</body>
</html>
