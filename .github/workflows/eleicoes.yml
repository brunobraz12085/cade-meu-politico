# Processa os resultados das eleições do TSE para um estado (roda só quando a gente mandar).
name: Eleições (TSE)

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "Sigla do estado (ex.: GO)"
        default: "GO"
        required: true
      anos:
        description: "Anos (ex.: 2024,2026)"
        default: "2024,2026"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ferramenta para diminuir as fotos
        run: command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - name: Processar arquivos do TSE
        env:
          ANOS: ${{ inputs.anos }}
        run: node scripts/eleicoes.mjs ${{ inputs.uf }}
      - name: Salvar resultados no repositório
        run: |
          git config user.name "cade-meu-politico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/eleicoes
          git commit -m "Eleições ${{ inputs.uf }} (${{ inputs.anos }})" || echo "Nada novo"
          git push
      - name: Publicar o site de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar.yml --ref main -f rapido=true
